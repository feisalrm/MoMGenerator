<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoM Generator</title>
  <link rel="stylesheet" href="assets/css/argon-dashboard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Calibri', sans-serif;
      background-color: #f8f9fe;
    }
    .card {
      border-radius: 1rem;
      box-shadow: 0 0.25rem 1rem rgba(0, 0, 0, 0.05);
    }
    .form-label {
      font-weight: 600;
    }
    textarea.form-control {
      min-height: 140px;
      resize: vertical;
    }
    .toggle-switch {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #5e72e4;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    #output {
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="card p-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="mb-0">📝 MoM Generator</h3>
            <div class="toggle-switch">
              <label class="form-label mb-0">🌓</label>
              <label class="switch">
                <input type="checkbox" id="toggleMode" onchange="toggleDarkMode(this)" />
                <span class="slider"></span>
              </label>
            </div>
          </div>

          <div class="mb-3">
            <label for="criteria" class="form-label">🎯 Kriteria Perapihan</label>
            <textarea class="form-control" id="criteria" placeholder="Contoh: Ringkas menjadi poin-poin, gunakan gaya formal, susun logis sesuai urutan waktu..."></textarea>
          </div>

          <div class="mb-3">
            <label for="rawText" class="form-label">🗒️ Catatan Mentah</label>
            <textarea class="form-control" id="rawText" placeholder="Masukkan catatan mentah hasil meeting di sini..."></textarea>
          </div>

          <button class="btn btn-primary" onclick="generateMoM()">✨ Proses</button>

          <div class="mt-4">
            <label for="output" class="form-label">📄 Hasil:</label>
            <div id="output" class="bg-light p-3 rounded border"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleDarkMode(toggle) {
      document.body.classList.toggle('bg-dark', toggle.checked);
      document.body.classList.toggle('text-white', toggle.checked);
      const card = document.querySelector('.card');
      if (toggle.checked) {
        card.classList.remove('bg-white');
        card.classList.add('bg-secondary');
      } else {
        card.classList.add('bg-white');
        card.classList.remove('bg-secondary');
      }
    }

    async function generateMoM() {
      const criteria = document.getElementById("criteria").value.trim();
      const rawText = document.getElementById("rawText").value.trim();
      const outputDiv = document.getElementById("output");

      if (!criteria || !rawText) {
        outputDiv.textContent = "⚠️ Harap isi kedua bidang sebelum memproses.";
        return;
      }

      outputDiv.innerHTML = '<span>⏳ Memproses... Mohon tunggu.</span>';

      try {
        const response = await fetch("https://momgenerator-production.up.railway.app/format-meeting", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            prompt: `Berikut adalah kriteria editing:\n${criteria}\n\nBerikut teks mentahnya:\n${rawText}\n\nHarap hasilkan teks yang sesuai kriteria tanpa tambahan formatting seperti tebal, miring, kecuali bullets dan numbering.`
          })
        });

        const data = await response.json();

        if (data.error) {
          outputDiv.textContent = "❌ Gagal memproses.\n" + JSON.stringify(data.error);
        } else {
          outputDiv.textContent = data.content || data.message || "(Tidak ada hasil)";
        }
      } catch (err) {
        outputDiv.textContent = "❌ Gagal memproses.\n" + err.message;
      }
    }
  </script>
</body>
</html>

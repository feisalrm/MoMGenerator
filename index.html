<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoM Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --bg-light: #f9fafb;
      --bg-dark: #1f2937;
      --text-light: #ffffff;
      --text-dark: #1e293b;
      --card-bg-light: #ffffff;
      --card-bg-dark: #2d3748;
      --output-bg-light: #f3f4f6;
      --output-bg-dark: #374151;
    }
    body {
      font-family: 'Inter', 'Calibri', sans-serif;
      margin: 0;
      padding: 2rem;
      background: linear-gradient(145deg, var(--bg-light), #eef2f3);
      color: var(--text-dark);
      transition: background 0.3s, color 0.3s;
    }
    body.dark-mode {
      background: linear-gradient(145deg, #1e293b, #111827);
      color: var(--text-light);
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: var(--card-bg-light);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: background 0.3s;
    }
    body.dark-mode .container {
      background: var(--card-bg-dark);
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1.2rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      justify-content: space-between;
    }
    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .theme-toggle input[type="checkbox"] {
      width: 40px;
      height: 20px;
      appearance: none;
      background: #ccc;
      border-radius: 20px;
      position: relative;
      outline: none;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .theme-toggle input[type="checkbox"]:checked {
      background: var(--primary);
    }
    .theme-toggle input[type="checkbox"]::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      top: 1px;
      left: 1px;
      transition: transform 0.3s ease;
    }
    .theme-toggle input[type="checkbox"]:checked::before {
      transform: translateX(20px);
    }
    label {
      font-weight: 600;
      display: block;
      margin-top: 1rem;
      margin-bottom: 0.4rem;
    }
    textarea {
      width: 100%;
      min-height: 140px;
      font-size: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      resize: vertical;
      background-color: var(--bg-light);
      font-family: 'Inter', 'Calibri', sans-serif;
      color: var(--text-dark);
    }
    body.dark-mode textarea {
      background-color: #1e293b;
      color: var(--text-light);
      border: 1px solid #475569;
    }
    button {
      width: fit-content;
      align-self: flex-start;
      margin-top: 1.6rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease-in-out;
    }
    button:hover {
      background-color: var(--primary-dark);
    }
    .output {
      background-color: var(--output-bg-light);
      margin-top: 2rem;
      padding: 1.25rem;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      white-space: pre-wrap;
      transition: background-color 0.3s;
    }
    body.dark-mode .output {
      background-color: var(--output-bg-dark);
      border-color: #4b5563;
      color: var(--text-light);
    }
    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }
      .container {
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
        flex-direction: column;
        align-items: flex-start;
      }
      textarea {
        font-size: 0.95rem;
      }
      button {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      📝 Perapihan Catatan Meeting
      <div class="theme-toggle">
        <label for="toggleMode">🌓</label>
        <input type="checkbox" id="toggleMode" onchange="toggleDarkMode(this)" />
      </div>
    </h1>

    <label for="criteria">🎯 Kriteria Perapihan (termasuk gaya, ringkasan, dll):</label>
    <textarea id="criteria" placeholder="Contoh: Ringkas menjadi poin-poin, gunakan gaya formal, susun logis sesuai urutan waktu..."></textarea>

    <label for="rawText">🗒️ Catatan Mentah:</label>
    <textarea id="rawText" placeholder="Masukkan catatan mentah hasil meeting di sini..."></textarea>

    <button onclick="generateMoM()">✨ Proses</button>

    <div id="output" class="output"></div>
  </div>

  <script>
    function toggleDarkMode(toggle) {
      document.body.classList.toggle('dark-mode', toggle.checked);
    }

    async function generateMoM() {
      const criteria = document.getElementById("criteria").value.trim();
      const rawText = document.getElementById("rawText").value.trim();
      const outputDiv = document.getElementById("output");

      if (!criteria || !rawText) {
        outputDiv.textContent = "⚠️ Harap isi kedua bidang sebelum memproses.";
        return;
      }

      outputDiv.innerHTML = '<span>⏳ Memproses... Mohon tunggu.</span>';

      try {
        const response = await fetch("https://momgenerator-production.up.railway.app/format-meeting", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            prompt: `Berikut adalah kriteria editing:\n${criteria}\n\nBerikut teks mentahnya:\n${rawText}\n\nHarap hasilkan teks yang sesuai kriteria tanpa tambahan formatting seperti tebal, miring, kecuali bullets dan numbering.`
          })
        });

        const data = await response.json();

        if (data.error) {
          outputDiv.textContent = "❌ Gagal memproses.\n" + JSON.stringify(data.error);
        } else {
          outputDiv.textContent = data.content || data.message || "(Tidak ada hasil)";
        }
      } catch (err) {
        outputDiv.textContent = "❌ Gagal memproses.\n" + err.message;
      }
    }
  </script>
</body>
</html>
